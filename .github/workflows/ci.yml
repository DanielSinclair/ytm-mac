name: CI
on:
  workflow_dispatch: # manual only while Actions minutes are limited
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen
      - run: xcodebuild -project ytm-mac.xcodeproj -scheme ytm-mac -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
